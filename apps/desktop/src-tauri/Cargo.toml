[package]
name = "ccr-desktop"
version = "0.1.0"
description = "Claude Code Router desktop client"
edition = "2021"
rust-version = "1.90"

[lib]
name = "ccr_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
getrandom = "0.3"
json5 = "0.4"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }

# Graceful SIGTERM delivery to the desktop-owned gateway child (unix only).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
tauri-nspanel = "2.1.1"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSEvent", "NSScreen", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSGeometry"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
