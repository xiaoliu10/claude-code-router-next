[package]
name = "ccr-desktop"
version = "0.1.4"
description = "Claude Code Router desktop client"
edition = "2021"
rust-version = "1.90"

[lib]
name = "ccr_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dunce = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["native-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
getrandom = "0.3"
json5 = "0.4"
# Same semver semantics the gateway catalog route uses (valid + gt).
semver = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

# Graceful SIGTERM delivery to the desktop-owned gateway child (unix only).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
tempfile = "3"
objc2 = "0.6"
tauri-nspanel = "2.1.1"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSEvent", "NSScreen", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSGeometry"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
