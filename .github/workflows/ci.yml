name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs for the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Verify WorkBuddy provider plugin (including npm artifact and real loader)
        env:
          CI: "true"
        shell: bash
        run: |
          set -euo pipefail
          sandbox="$(mktemp -d "${RUNNER_TEMP}/ccr-workbuddy.XXXXXX")"
          mkdir -p "$sandbox/home" "$sandbox/tmp"
          export HOME="$sandbox/home" CCR_CONFIG_DIR="$sandbox/home" TMPDIR="$sandbox/tmp"
          pnpm --filter @wengine-ai/ccr-provider-workbuddy verify
